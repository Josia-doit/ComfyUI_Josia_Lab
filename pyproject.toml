[project]
name = "comfyui-josialab"
version = "0.2.0"
description = "JosiaNodes 实验包：与主节点包分离的独立试验田。含 Qwen-Image 2.1 加速 LoRA 适配器（Fun PDD / Viggle Turbo 两条路线）、Josia框选编辑（图像上画框标注、导出官方格式 JSON），以及新增的 Josia媒体中枢与媒体枢纽：中枢一个节点集中管理多路图像/视频/音频（点击或拖拽上传、缩略图/视频/波形预览、单路跳过），只输出一根媒体总线；枢纽把总线拆成独立 IMAGE/VIDEO/AUDIO 端口，省去一长排接线。"
authors = [{ name = "Josia-doit" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["comfyui", "experimental", "josia"]
classifiers = ["Framework :: ComfyUI"]
dependencies = []

[project.urls]
Repository = "https://github.com/Josia-doit/ComfyUI_Josia_Lab"

# 与主包 ComfyUI_JosiaNodes 同一套 key（[tool.comfy]），发布到注册表时按这里取值
[tool.comfy]
PublisherId = "josia"
DisplayName = "JosiaNodes Lab"
Icon = "https://raw.githubusercontent.com/Josia-doit/ComfyUI_Josia_Lab/main/icon.png"
NodePackID = "comfyui-josialab"
Category = "⚡️Josia实验区"
